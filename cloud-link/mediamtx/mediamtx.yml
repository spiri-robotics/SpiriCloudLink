# cloud-link's MediaMTX: WebRTC only, one path, read-only. Anything not set
# here is MediaMTX's default.
logLevel: info

# Only WHEP. No control API, metrics, recording or other protocols.
api: no
metrics: no
pprof: no
playback: no
rtsp: no
rtmp: no
hls: no
srt: no
moq: no

webrtc: yes
webrtcAddress: :8889
# Media on one fixed UDP port, on every address the robot has (NetBird's
# among them). No STUN: viewers come over the VPN.
webrtcLocalUDPAddress: :8189
webrtcIPsFromInterfaces: yes
webrtcICEServers2: []

# Anyone who can reach it may watch; nobody may publish. Reaching it at all
# is NetBird's decision.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read

paths:
  # The camera's own H.264, from SpiriCamera's relay mount on the robot's
  # loopback, relayed untouched. Overridden by MTX_PATHS_CAMERA_SOURCE, from
  # the Stream setting. The relay mount is TCP only. Pulled only while someone
  # is watching, so an unwatched camera costs no encoding.
  camera:
    source: rtsp://127.0.0.1:8554/raw/relay
    rtspTransport: tcp
    sourceOnDemand: yes
